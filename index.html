<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme before first paint: explicit choice from storage, otherwise the system preference.
      // Only touches <html>, which React does not manage.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.classList.add(dark ? 'dark' : 'light');
        window.requestAnimationFrame(function () { window.requestAnimationFrame(function () { d.classList.add('theme-ready'); }); });
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
